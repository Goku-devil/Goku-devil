<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 10" width="120" height="100" fill="#00C83C">
  <style>
    .octopus {
      transform-box: fill-box;
      transform-origin: center;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-1.2px) rotate(2deg); }
    }
  </style>

  <g class="octopus">
    <rect x="3" y="0" width="6" height="1" />
    <rect x="2" y="1" width="8" height="2" />
    <rect x="1" y="3" width="10" height="3" />

    <rect x="3" y="3" width="2" height="2" fill="#0D0D0D" />
    <rect x="7" y="3" width="2" height="2" fill="#0D0D0D" />

    <rect x="1" y="6" width="2" height="2" />
    <rect x="4" y="6" width="1" height="3" />
    <rect x="7" y="6" width="1" height="3" />
    <rect x="9" y="6" width="2" height="2" />
    <rect x="0" y="8" width="2" height="1" />
    <rect x="3" y="8" width="1" height="2" />
    <rect x="8" y="8" width="1" height="2" />
    <rect x="10" y="8" width="2" height="1" />
    <rect x="5" y="9" width="2" height="1" />
  </g>
</svg>