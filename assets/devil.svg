<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 10" width="120" height="100" fill="#00ff00">
  <style>
    .devil {
      transform-box: fill-box;
      transform-origin: center;
      animation: float 2.8s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-1.5px) rotate(1deg); }
    }
  </style>

  <g class="devil">
    <rect x="1" y="0" width="1" height="1" />
    <rect x="10" y="0" width="1" height="1" />
    <rect x="1" y="1" width="2" height="1" />
    <rect x="9" y="1" width="2" height="1" />

    <rect x="2" y="2" width="8" height="1" />
    <rect x="0" y="3" width="12" height="1" />

    <rect x="1" y="4" width="2" height="1" />
    <rect x="4" y="4" width="4" height="1" />
    <rect x="9" y="4" width="2" height="1" />
    <rect x="1" y="5" width="3" height="1" />
    <rect x="5" y="5" width="2" height="1" />
    <rect x="8" y="5" width="3" height="1" />

    <rect x="2" y="6" width="8" height="1" />

    <rect x="2" y="7" width="1" height="1" />
    <rect x="4" y="7" width="1" height="1" />
    <rect x="7" y="7" width="1" height="1" />
    <rect x="9" y="7" width="1" height="1" />

    <rect x="3" y="8" width="6" height="1" />
    <rect x="5" y="9" width="2" height="1" />
  </g>
</svg>