<svg width="420" height="108" viewBox="0 -12 140 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <clipPath id="typing-clip">
      <rect x="0" y="0" width="0" height="12" class="type-mask" />
    </clipPath>
  </defs>

  <style>
    .header-devil {
      transform-box: fill-box;
      transform-origin: center;
      animation: headerFloat 2.8s ease-in-out infinite;
    }

    @keyframes headerFloat {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-1.5px) rotate(1deg); }
    }

    /* 1. /home/ Typing Animation */
    .type-mask {
      animation: typing 0.75s steps(6, end) 0.1s forwards;
    }

    .cursor {
      opacity: 0;
      animation:
        cursorMove 0.75s steps(6, end) 0.1s forwards,
        cursorBlink 0.45s step-end 0.1s 3;
    }

    @keyframes typing {
      from { width: 0; }
      to   { width: 42px; }
    }

    @keyframes cursorMove {
      0%   { transform: translateX(0px); opacity: 1; }
      99%  { opacity: 1; }
      100% { transform: translateX(42px); opacity: 0; }
    }

    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }

    /* 2. goku-devil Pixel Swarm Animation (White Only) */
    .px {
      fill: #00ff00;
      opacity: 0;
      transform: translate(var(--dx), var(--dy));
      animation: swarmIn 1.35s cubic-bezier(0.16, 1, 0.3, 1) var(--d, 0.7s) forwards;
    }

    @keyframes swarmIn {
      0% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy));
      }
      15% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: translate(0px, 0px);
      }
    }
  </style>

  
